# Sobe o backend (Spring Boot / Java 25) e o frontend (React / Nginx).
# O banco continua no Supabase: preencha demo/.env a partir de demo/.env.example.
#
#   docker compose up --build      -> http://localhost:5173

name: comunicode

services:
  backend:
    build: ./demo
    env_file:
      - path: ./demo/.env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: supabase
    ports:
      - "8081:8081"   # opcional: acesso direto a API para testes
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
