spring.application.name=demo
server.port=8081

# Inicializacao normal conecta ao Supabase, sem inserir exemplos.
spring.profiles.default=supabase
# O perfil de carga reutiliza a mesma conexao.
spring.profiles.group.teste-banco=supabase
spring.sql.init.mode=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true

# Upload de materiais: ate 5 arquivos de 25 MB (o ValidadorArquivos confere de novo).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=130MB
# Permite ler o corpo excedente e responder 413 em vez de derrubar a conexao.
server.tomcat.max-swallow-size=140MB
