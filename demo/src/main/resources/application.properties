spring.application.name=demo
server.port=8081

# Inicializacao normal conecta ao Supabase, sem inserir exemplos.
spring.profiles.default=supabase
# O perfil de carga reutiliza a mesma conexao.
spring.profiles.group.teste-banco=supabase
spring.sql.init.mode=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
